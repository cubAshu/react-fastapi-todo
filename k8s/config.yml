kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
nodes:
- role: control-plane
- role: worker                      # app node: the only one with port mappings , node label declertive use kar skte h , but phir sabhi ko extra port mapping krna pdega , so yahi pe labeling kardi , app me frontend or backend dono ko same node pe run krna h , so yahi pe label krdiya
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "tier=app"
  extraMounts:
  - hostPath: /home/ashu/Projects/common-pv
    containerPath: /mnt/data
  extraPortMappings:
  - containerPort: 80
    hostPort: 8089
    protocol: TCP
  - containerPort: 443
    hostPort: 443
    protocol: TCP
- role: worker                      # db node
  kubeadmConfigPatches:
  - |
    kind: JoinConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "tier=db"
  extraMounts:
  - hostPath: /home/ashu/Projects/common-pv
    containerPath: /mnt/data
- role: worker                      # spare node
  extraMounts:
  - hostPath: /home/ashu/Projects/common-pv
    containerPath: /mnt/data